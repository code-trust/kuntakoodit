name: Update municipality data

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Download latest classification
        id: update
        run: nix develop --command task update-data

      - name: Test with new data
        run: nix develop --command task test

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger CI. Set a
          # DATA_UPDATE_TOKEN secret (PAT or GitHub App token) to get CI runs.
          token: ${{ secrets.DATA_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          add-paths: data/
          branch: update-municipality-data
          delete-branch: true
          commit-message: "Update municipality data (${{ steps.update.outputs.classification }})"
          title: "Update municipality data (${{ steps.update.outputs.classification }})"
          body: |
            Statistics Finland municipality classification `${{ steps.update.outputs.classification }}` has changed.

            Generated by the monthly [update workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
