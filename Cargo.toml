[package]
categories = ["data-structures"]
description = "Look up Finnish municipality codes (kuntakoodi) by municipality name, using Statistics Finland data"
edition = "2024"
include = ["/build.rs", "/data", "/src", "/LICENSE", "/README.md"]
keywords = ["finland", "kunta", "kuntakoodi", "municipality", "statistics"]
license = "MIT AND CC-BY-4.0"
name = "kuntakoodit"
repository = "https://github.com/code-trust/kuntakoodit"
version = "0.1.0"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
